[project]
name = "robinhood-pump-bot"
version = "0.1.0"
description = "Telegram bot scanner for newly pumping Robinhood Chain tokens"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.0",
  "python-telegram-bot>=21.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
